services:
  # Ollama with CUDA for NVIDIA GPU
  ollama:
    image: ollama/ollama
    container_name: loguard_ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LoguardLLM Django Application
  app:
    build: .
    container_name: loguard_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - chroma_data:/app/chroma_data
      - ./sample_logs:/app/sample_logs
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DJANGO_SETTINGS_MODULE=loguard.settings
      - PYTHONUNBUFFERED=1
    depends_on:
      - ollama
    restart: unless-stopped

  # Real-time Log Analyzer
  analyzer:
    build: .
    container_name: loguard_analyzer
    command: python manage.py run_analyzer
    volumes:
      - .:/app
      - chroma_data:/app/chroma_data
      - ./sample_logs:/app/sample_logs
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DJANGO_SETTINGS_MODULE=loguard.settings
      - PYTHONUNBUFFERED=1
    depends_on:
      - ollama
      - app
    restart: unless-stopped

volumes:
  ollama_data:
  chroma_data:
